<!doctype html>
<html lang="en" data-studio-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141518" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%folio.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="description" content="Folio Studio — Visual-First Full-Stack Web Development Studio." />
    <title>Folio Studio</title>
    <script>
      try {
        var saved = window.localStorage.getItem('folio.studio-theme.v1');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.dataset.studioTheme = saved;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
